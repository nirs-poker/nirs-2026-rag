<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Покерный тренер - регистрация</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>
<main class="box wide">
  <div class="brand">
    <div class="chips"><span></span><span></span><span></span></div>
    <h1>Регистрация</h1>
    <p class="sub">Сохраняйте историю разборов и возвращайтесь к ним</p>
  </div>

  <form action="prototype.html">
    <div class="grid">
      <div>
        <label for="name">Имя или ник</label>
        <input id="name" type="text" required placeholder="Как к вам обращаться" autocomplete="nickname">
      </div>
      <div>
        <label for="email">Email</label>
        <input id="email" type="email" required placeholder="you@example.com" autocomplete="email">
      </div>
      <div>
        <label for="password">Пароль</label>
        <input id="password" type="password" required minlength="8" placeholder="От 8 символов" autocomplete="new-password">
      </div>
      <div>
        <label for="password2">Повторите пароль</label>
        <input id="password2" type="password" required minlength="8" placeholder="••••••••" autocomplete="new-password">
      </div>
    </div>

    <label class="check"><input type="checkbox" required> Понимаю, что сервис - тренажёр для обучения и не предназначен для использования во время реальной игры</label>

    <button class="btn" type="submit">Создать аккаунт</button>
  </form>

  <p class="alt">Уже есть аккаунт? <a href="login.html">Войти</a></p>
</main>
</body>
</html>
