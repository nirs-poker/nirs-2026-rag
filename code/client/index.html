<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171010">
  <title>Покерный тренер</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/trainer.css">
  <script src="trainer.js" defer></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand"><span aria-hidden="true">♠</span><strong>Покерный тренер</strong></div>
      <button class="new" type="button" id="reset">+ Новый чат</button>
      <nav class="examples" aria-label="Примеры вопросов">
        <h2>Попробуйте спросить</h2>
        <button type="button">Что такое 3-бет на префлопе?</button>
        <button type="button">Кто ходит первым после флопа один на один?</button>
        <button type="button">Что сильнее: стрит или флеш?</button>
        <button type="button">Что такое шансы банка?</button>
      </nav>
      <a href="prototype.html">Демонстрация раздач</a>
    </aside>
    <main class="workspace">
      <header class="topbar"><h1>Техасский холдем</h1></header>
      <div class="scroll" id="scroll">
        <section class="welcome" id="welcome">
          <div class="felt" aria-hidden="true">
            <div class="cards"><span class="card ace">A<small>♠</small></span><span class="card king">K<small>♥</small></span></div>
          </div>
          <h2>Что разберём?</h2>
          <p>Спросите про правила, комбинации или стратегию. Источники можно открыть под ответом.</p>
        </section>
        <div class="messages" id="messages" role="log" aria-label="Переписка"></div>
      </div>
      <footer class="composer">
        <form id="ask">
          <label for="question" class="sr-only">Ваш вопрос</label>
          <textarea id="question" placeholder="Ваш вопрос о холдеме…" rows="1" maxlength="1500" required></textarea>
          <button type="submit" id="send">Спросить <span aria-hidden="true">↑</span></button>
        </form>
      </footer>
    </main>
  </div>
</body>
</html>
