<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320">
  <!-- Плитка ковра 320x320: золотые орнаментные полосы по верхнему и левому краю (при повторе дают сетку),
       розетки симметрично внутри клетки, медальон на пересечении полос. Поверх плитки в CSS лежит лёгкое затемнение. -->
  <defs>
    <pattern id="b" width="32" height="28" patternUnits="userSpaceOnUse">
      <rect width="32" height="28" fill="#2a0a10"/>
      <rect width="32" height="3" fill="#c9a24a"/>
      <rect y="25" width="32" height="3" fill="#c9a24a"/>
      <line x1="0" y1="5" x2="32" y2="5" stroke="#8a6a2a" stroke-width=".8"/>
      <line x1="0" y1="23" x2="32" y2="23" stroke="#8a6a2a" stroke-width=".8"/>
      <circle cx="0" cy="14" r="4.5" fill="none" stroke="#c9a24a" stroke-width="1.4"/>
      <circle cx="32" cy="14" r="4.5" fill="none" stroke="#c9a24a" stroke-width="1.4"/>
      <polygon points="16,7 25,14 16,21 7,14" fill="#c9a24a"/>
      <polygon points="16,10 21,14 16,18 11,14" fill="#2a0a10"/>
      <circle cx="16" cy="14" r="1.6" fill="#e0bd6a"/>
      <circle cx="4.5" cy="8" r=".9" fill="#c9a24a"/>
      <circle cx="4.5" cy="20" r=".9" fill="#c9a24a"/>
      <circle cx="27.5" cy="8" r=".9" fill="#c9a24a"/>
      <circle cx="27.5" cy="20" r=".9" fill="#c9a24a"/>
    </pattern>
    <pattern id="bv" href="#b" patternTransform="rotate(90)"/>
    <g id="r" fill="#c9a24a" fill-opacity=".75">
      <circle r="2.4"/>
      <circle cx="5.5" r="1.7"/><circle cx="-5.5" r="1.7"/><circle cy="5.5" r="1.7"/><circle cy="-5.5" r="1.7"/>
      <circle cx="3.9" cy="3.9" r="1.2"/><circle cx="-3.9" cy="3.9" r="1.2"/>
      <circle cx="3.9" cy="-3.9" r="1.2"/><circle cx="-3.9" cy="-3.9" r="1.2"/>
    </g>
    <!-- мелкий узор-крестик: четыре лепестка и центр, как на референсе -->
    <g id="s" fill="#c9a24a" fill-opacity=".8">
      <circle r="1.3"/>
      <ellipse cy="-2.6" rx="1" ry="1.4"/><ellipse cy="2.6" rx="1" ry="1.4"/>
      <ellipse cx="-2.6" rx="1.4" ry="1"/><ellipse cx="2.6" rx="1.4" ry="1"/>
    </g>
  </defs>

  <rect width="320" height="28" fill="url(#b)"/>
  <rect width="28" height="320" fill="url(#bv)"/>

  <!-- 1. большие розетки: шахматный порядок на сетке 6x6, образуют ромбы -->
  <use href="#r" x="76.7" y="76.7"/><use href="#r" x="76.7" y="174.0"/><use href="#r" x="76.7" y="271.3"/><use href="#r" x="125.3" y="125.3"/><use href="#r" x="125.3" y="222.7"/><use href="#r" x="174.0" y="76.7"/><use href="#r" x="174.0" y="174.0"/><use href="#r" x="174.0" y="271.3"/>
  <use href="#r" x="222.7" y="125.3"/><use href="#r" x="222.7" y="222.7"/><use href="#r" x="271.3" y="76.7"/><use href="#r" x="271.3" y="174.0"/><use href="#r" x="271.3" y="271.3"/>

  <!-- 2. мелкие крестики: во всех остальных узлах сетки вдвое мельче (между розетками и в центрах ромбов) -->
  <use href="#s" x="76.7" y="125.3"/><use href="#s" x="76.7" y="222.7"/><use href="#s" x="125.3" y="76.7"/><use href="#s" x="125.3" y="174.0"/><use href="#s" x="125.3" y="271.3"/><use href="#s" x="174.0" y="125.3"/><use href="#s" x="174.0" y="222.7"/><use href="#s" x="222.7" y="76.7"/>
  <use href="#s" x="222.7" y="174.0"/><use href="#s" x="222.7" y="271.3"/><use href="#s" x="271.3" y="125.3"/><use href="#s" x="271.3" y="222.7"/><use href="#s" x="52.3" y="52.3"/><use href="#s" x="52.3" y="101.0"/><use href="#s" x="52.3" y="149.7"/><use href="#s" x="52.3" y="198.3"/>
  <use href="#s" x="52.3" y="247.0"/><use href="#s" x="52.3" y="295.7"/><use href="#s" x="101.0" y="52.3"/><use href="#s" x="101.0" y="101.0"/><use href="#s" x="101.0" y="149.7"/><use href="#s" x="101.0" y="198.3"/><use href="#s" x="101.0" y="247.0"/><use href="#s" x="101.0" y="295.7"/>
  <use href="#s" x="149.7" y="52.3"/><use href="#s" x="149.7" y="101.0"/><use href="#s" x="149.7" y="149.7"/><use href="#s" x="149.7" y="198.3"/><use href="#s" x="149.7" y="247.0"/><use href="#s" x="149.7" y="295.7"/><use href="#s" x="198.3" y="52.3"/><use href="#s" x="198.3" y="101.0"/>
  <use href="#s" x="198.3" y="149.7"/><use href="#s" x="198.3" y="198.3"/><use href="#s" x="198.3" y="247.0"/><use href="#s" x="198.3" y="295.7"/><use href="#s" x="247.0" y="52.3"/><use href="#s" x="247.0" y="101.0"/><use href="#s" x="247.0" y="149.7"/><use href="#s" x="247.0" y="198.3"/>
  <use href="#s" x="247.0" y="247.0"/><use href="#s" x="247.0" y="295.7"/><use href="#s" x="295.7" y="52.3"/><use href="#s" x="295.7" y="101.0"/><use href="#s" x="295.7" y="149.7"/><use href="#s" x="295.7" y="198.3"/><use href="#s" x="295.7" y="247.0"/><use href="#s" x="295.7" y="295.7"/>

  <!-- 3. крошечные точки: на четвертях шага, между мелкими узорами -->
  <g fill="#c9a24a" fill-opacity=".45">
  <circle cx="40.2" cy="40.2" r=".9"/><circle cx="40.2" cy="64.5" r=".9"/><circle cx="40.2" cy="88.8" r=".9"/><circle cx="40.2" cy="113.2" r=".9"/><circle cx="40.2" cy="137.5" r=".9"/><circle cx="40.2" cy="161.8" r=".9"/><circle cx="40.2" cy="186.2" r=".9"/><circle cx="40.2" cy="210.5" r=".9"/>
  <circle cx="40.2" cy="234.8" r=".9"/><circle cx="40.2" cy="259.2" r=".9"/><circle cx="40.2" cy="283.5" r=".9"/><circle cx="40.2" cy="307.8" r=".9"/><circle cx="64.5" cy="40.2" r=".9"/><circle cx="64.5" cy="64.5" r=".9"/><circle cx="64.5" cy="88.8" r=".9"/><circle cx="64.5" cy="113.2" r=".9"/>
  <circle cx="64.5" cy="137.5" r=".9"/><circle cx="64.5" cy="161.8" r=".9"/><circle cx="64.5" cy="186.2" r=".9"/><circle cx="64.5" cy="210.5" r=".9"/><circle cx="64.5" cy="234.8" r=".9"/><circle cx="64.5" cy="259.2" r=".9"/><circle cx="64.5" cy="283.5" r=".9"/><circle cx="64.5" cy="307.8" r=".9"/>
  <circle cx="88.8" cy="40.2" r=".9"/><circle cx="88.8" cy="64.5" r=".9"/><circle cx="88.8" cy="88.8" r=".9"/><circle cx="88.8" cy="113.2" r=".9"/><circle cx="88.8" cy="137.5" r=".9"/><circle cx="88.8" cy="161.8" r=".9"/><circle cx="88.8" cy="186.2" r=".9"/><circle cx="88.8" cy="210.5" r=".9"/>
  <circle cx="88.8" cy="234.8" r=".9"/><circle cx="88.8" cy="259.2" r=".9"/><circle cx="88.8" cy="283.5" r=".9"/><circle cx="88.8" cy="307.8" r=".9"/><circle cx="113.2" cy="40.2" r=".9"/><circle cx="113.2" cy="64.5" r=".9"/><circle cx="113.2" cy="88.8" r=".9"/><circle cx="113.2" cy="113.2" r=".9"/>
  <circle cx="113.2" cy="137.5" r=".9"/><circle cx="113.2" cy="161.8" r=".9"/><circle cx="113.2" cy="186.2" r=".9"/><circle cx="113.2" cy="210.5" r=".9"/><circle cx="113.2" cy="234.8" r=".9"/><circle cx="113.2" cy="259.2" r=".9"/><circle cx="113.2" cy="283.5" r=".9"/><circle cx="113.2" cy="307.8" r=".9"/>
  <circle cx="137.5" cy="40.2" r=".9"/><circle cx="137.5" cy="64.5" r=".9"/><circle cx="137.5" cy="88.8" r=".9"/><circle cx="137.5" cy="113.2" r=".9"/><circle cx="137.5" cy="137.5" r=".9"/><circle cx="137.5" cy="161.8" r=".9"/><circle cx="137.5" cy="186.2" r=".9"/><circle cx="137.5" cy="210.5" r=".9"/>
  <circle cx="137.5" cy="234.8" r=".9"/><circle cx="137.5" cy="259.2" r=".9"/><circle cx="137.5" cy="283.5" r=".9"/><circle cx="137.5" cy="307.8" r=".9"/><circle cx="161.8" cy="40.2" r=".9"/><circle cx="161.8" cy="64.5" r=".9"/><circle cx="161.8" cy="88.8" r=".9"/><circle cx="161.8" cy="113.2" r=".9"/>
  <circle cx="161.8" cy="137.5" r=".9"/><circle cx="161.8" cy="161.8" r=".9"/><circle cx="161.8" cy="186.2" r=".9"/><circle cx="161.8" cy="210.5" r=".9"/><circle cx="161.8" cy="234.8" r=".9"/><circle cx="161.8" cy="259.2" r=".9"/><circle cx="161.8" cy="283.5" r=".9"/><circle cx="161.8" cy="307.8" r=".9"/>
  <circle cx="186.2" cy="40.2" r=".9"/><circle cx="186.2" cy="64.5" r=".9"/><circle cx="186.2" cy="88.8" r=".9"/><circle cx="186.2" cy="113.2" r=".9"/><circle cx="186.2" cy="137.5" r=".9"/><circle cx="186.2" cy="161.8" r=".9"/><circle cx="186.2" cy="186.2" r=".9"/><circle cx="186.2" cy="210.5" r=".9"/>
  <circle cx="186.2" cy="234.8" r=".9"/><circle cx="186.2" cy="259.2" r=".9"/><circle cx="186.2" cy="283.5" r=".9"/><circle cx="186.2" cy="307.8" r=".9"/><circle cx="210.5" cy="40.2" r=".9"/><circle cx="210.5" cy="64.5" r=".9"/><circle cx="210.5" cy="88.8" r=".9"/><circle cx="210.5" cy="113.2" r=".9"/>
  <circle cx="210.5" cy="137.5" r=".9"/><circle cx="210.5" cy="161.8" r=".9"/><circle cx="210.5" cy="186.2" r=".9"/><circle cx="210.5" cy="210.5" r=".9"/><circle cx="210.5" cy="234.8" r=".9"/><circle cx="210.5" cy="259.2" r=".9"/><circle cx="210.5" cy="283.5" r=".9"/><circle cx="210.5" cy="307.8" r=".9"/>
  <circle cx="234.8" cy="40.2" r=".9"/><circle cx="234.8" cy="64.5" r=".9"/><circle cx="234.8" cy="88.8" r=".9"/><circle cx="234.8" cy="113.2" r=".9"/><circle cx="234.8" cy="137.5" r=".9"/><circle cx="234.8" cy="161.8" r=".9"/><circle cx="234.8" cy="186.2" r=".9"/><circle cx="234.8" cy="210.5" r=".9"/>
  <circle cx="234.8" cy="234.8" r=".9"/><circle cx="234.8" cy="259.2" r=".9"/><circle cx="234.8" cy="283.5" r=".9"/><circle cx="234.8" cy="307.8" r=".9"/><circle cx="259.2" cy="40.2" r=".9"/><circle cx="259.2" cy="64.5" r=".9"/><circle cx="259.2" cy="88.8" r=".9"/><circle cx="259.2" cy="113.2" r=".9"/>
  <circle cx="259.2" cy="137.5" r=".9"/><circle cx="259.2" cy="161.8" r=".9"/><circle cx="259.2" cy="186.2" r=".9"/><circle cx="259.2" cy="210.5" r=".9"/><circle cx="259.2" cy="234.8" r=".9"/><circle cx="259.2" cy="259.2" r=".9"/><circle cx="259.2" cy="283.5" r=".9"/><circle cx="259.2" cy="307.8" r=".9"/>
  <circle cx="283.5" cy="40.2" r=".9"/><circle cx="283.5" cy="64.5" r=".9"/><circle cx="283.5" cy="88.8" r=".9"/><circle cx="283.5" cy="113.2" r=".9"/><circle cx="283.5" cy="137.5" r=".9"/><circle cx="283.5" cy="161.8" r=".9"/><circle cx="283.5" cy="186.2" r=".9"/><circle cx="283.5" cy="210.5" r=".9"/>
  <circle cx="283.5" cy="234.8" r=".9"/><circle cx="283.5" cy="259.2" r=".9"/><circle cx="283.5" cy="283.5" r=".9"/><circle cx="283.5" cy="307.8" r=".9"/><circle cx="307.8" cy="40.2" r=".9"/><circle cx="307.8" cy="64.5" r=".9"/><circle cx="307.8" cy="88.8" r=".9"/><circle cx="307.8" cy="113.2" r=".9"/>
  <circle cx="307.8" cy="137.5" r=".9"/><circle cx="307.8" cy="161.8" r=".9"/><circle cx="307.8" cy="186.2" r=".9"/><circle cx="307.8" cy="210.5" r=".9"/><circle cx="307.8" cy="234.8" r=".9"/><circle cx="307.8" cy="259.2" r=".9"/><circle cx="307.8" cy="283.5" r=".9"/><circle cx="307.8" cy="307.8" r=".9"/>
  </g>

  <!-- медальон на пересечении полос -->
  <rect width="28" height="28" fill="#2a0a10"/>
  <rect x="1.5" y="1.5" width="25" height="25" fill="none" stroke="#c9a24a" stroke-width="3"/>
  <polygon points="14,5 23,14 14,23 5,14" fill="#c9a24a"/>
  <circle cx="14" cy="14" r="3" fill="#2a0a10"/>
  <circle cx="14" cy="14" r="1.4" fill="#e0bd6a"/>
</svg>
