<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Покерный тренер - вход</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>
<main class="box">
  <div class="brand">
    <div class="fan"><span>A♠</span><span>K♥</span><span>Q♣</span></div>
    <h1>Вход</h1>
    <p class="sub">Продолжите разбор своих раздач</p>
  </div>

  <form>
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="you@example.com" autocomplete="email">

    <label for="password">Пароль</label>
    <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">

    <div class="row">
      <label><input type="checkbox"> Запомнить меня</label>
      <a href="#">Забыли пароль?</a>
    </div>

    <!-- В прототипе кнопка просто ведёт в чат; в приложении здесь будет отправка формы -->
    <a class="btn" href="prototype.html">Войти</a>
  </form>

  <p class="alt">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
</main>
</body>
</html>
